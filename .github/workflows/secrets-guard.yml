name: Secrets Guard

# Backstop only. The real gate is .githooks/pre-push, which runs the same script
# before anything leaves the machine, plus GitHub push protection at the receive
# side. By the time this workflow runs, a pushed key is already world-readable on
# a public repo and a force-push does not unpublish it.
#
# NO path filter and every branch, deliberately: a credential can arrive via any
# commit on any ref, and an earlier review proved that a push to a side branch
# bypassed a main-only trigger entirely. Pure git/grep, so ubuntu in seconds.
on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  guard:
    name: No credentials in tracked files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      # One shared script with the pre-push hook. Two copies of these rules would
      # drift, and a drifted guard is worse than none.
      - name: scripts/secrets-check.sh
        run: ./scripts/secrets-check.sh
