name: PostureLogic Tests

on:
  push:
    branches: [main]
    paths:
      - 'PostureLogic/**'
      - '.github/workflows/tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'PostureLogic/**'
      - '.github/workflows/tests.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Swift Package Tests
    # The same toolchain as the app's tests (app-tests.yml), so the package is built by one Swift.
    runs-on: macos-26
    timeout-minutes: 20
    defaults:
      run:
        working-directory: PostureLogic
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Resolve dependencies
        run: swift package resolve

      - name: Build
        run: swift build

      - name: Run tests
        run: swift test
