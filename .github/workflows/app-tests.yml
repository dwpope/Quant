name: App Tests

# The PostureLogic workflow only ever builds the Swift package, so an app-target
# break — or an app test invalidated by a package change — reaches main unseen.
# This job closes that gap by running the real Xcode test suite on a simulator.
on:
  push:
    branches: [main]
    paths:
      - 'Quant/**'
      - 'QuantTests/**'
      - 'Quant.xcodeproj/**'
      # A package change can compile cleanly yet invalidate an app test (adding
      # defaulted init parameters, for instance), so watch it here too.
      - 'PostureLogic/**'
      # The Watch app and its tests, for the watch-tests job below.
      - 'QuantWatch Watch App/**'
      - 'QuantWatch Watch AppTests/**'
      - '.github/workflows/app-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Quant/**'
      - 'QuantTests/**'
      - 'Quant.xcodeproj/**'
      # A package change can compile cleanly yet invalidate an app test (adding
      # defaulted init parameters, for instance), so watch it here too.
      - 'PostureLogic/**'
      # The Watch app and its tests, for the watch-tests job below.
      - 'QuantWatch Watch App/**'
      - 'QuantWatch Watch AppTests/**'
      - '.github/workflows/app-tests.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: QuantNoWatchTests (iOS Simulator)
    # macos-26 (Xcode 26.x, Swift >= 6.2) is required, not preference: ten
    # classes use `nonisolated deinit` to keep the MainActor isolated-deinit
    # back-deploy shim out of XCTest's dealloc path. On macos-15's Xcode 16.4
    # that is still gated behind -enable-experimental-feature IsolatedDeinit and
    # the build fails at LivePostureDataSource.swift:11.
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Pick and boot a simulator
        id: sim
        timeout-minutes: 10
        # Resolve a UDID rather than hardcoding a device name: which iPhones
        # exist depends on the runner image's Xcode, and a stale name fails the
        # job with an unhelpful destination error.
        #
        # Boot it here rather than letting `xcodebuild test` do it implicitly.
        # Run 35722518127 built the app successfully and then sat silent for
        # 43m46s with zero test output before hitting the job timeout — the test
        # harness never started. An explicit boot both avoids that and localises
        # it: if the boot is what hangs, this step times out and says so instead
        # of disappearing into an unattributed silence inside xcodebuild.
        run: |
          udid=$(xcrun simctl list devices available \
            | sed -n 's/.*iPhone[^(]*(\([0-9A-Fa-f-]\{36\}\)).*/\1/p' | head -1)
          if [ -z "$udid" ]; then
            echo "::error::no available iPhone simulator on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          xcrun simctl boot "$udid" || true      # already-booted is not an error
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl list devices | grep -F "$udid"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 25
        env:
          # Stream xcodebuild's output instead of buffering it, so a stall shows
          # where it stalled.
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild test \
            -project Quant.xcodeproj \
            -scheme QuantNoWatchTests \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            -parallel-testing-enabled NO \
            -test-timeouts-enabled YES \
            -maximum-test-execution-time-allowance 120

      - name: Summarise results
        if: always()
        # Read counts from the result bundle, not stdout: xcodebuild's concurrent
        # stdout writes interleave and mangle occasional "Test case" lines.
        run: |
          [ -d TestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary \
            --path TestResults.xcresult > summary.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("summary.json"))
          print(f'**{d.get("result")}** - {d.get("passedTests")} passed, '
                f'{d.get("failedTests")} failed, {d.get("skippedTests")} skipped, '
                f'of {d.get("totalTestCount")} tests')
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        # `failure()` is false when a job is cancelled by its own timeout, which
        # is exactly the case where the bundle is most wanted.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: TestResults.xcresult
          path: TestResults.xcresult
          retention-days: 7

  watch-tests:
    name: QuantWatch Watch AppTests (watchOS Simulator)
    # The phone and the Watch each keep their own copy of the Jev remote's message
    # format, and each side's tests assert the same golden dictionaries. Until
    # 2026-10-01 only the phone's half ran in CI, so a change to the Watch's copy
    # alone could break the pairing with every check green.
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Pick and boot a Watch simulator
        id: sim
        timeout-minutes: 10
        # By UDID, for the same reasons as the iOS job above. Read from JSON
        # rather than the text listing: Watch names carry their own parentheses,
        # "Apple Watch Series 11 (46mm)", which trip a name-then-UDID pattern.
        # The newest watchOS runtime no newer than this Xcode's Watch SDK, since a
        # runner can carry runtimes its Xcode can't run tests on.
        run: |
          sdk=$(xcrun --sdk watchsimulator --show-sdk-version)
          echo "watchsimulator SDK $sdk"
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          sdk = tuple(int(x) for x in sys.argv[1].split("."))
          best = None
          for runtime, items in json.load(sys.stdin)["devices"].items():
              m = re.search(r"watchOS-(\d+)-(\d+)", runtime)
              if not m:
                  continue
              version = (int(m.group(1)), int(m.group(2)))
              available = [d for d in items if d.get("isAvailable")]
              if available and version <= sdk[:2] and (best is None or version > best[0]):
                  best = (version, available[0]["udid"])
          if best:
              print(best[1])
          ' "$sdk")
          if [ -z "$udid" ]; then
            echo "::error::no available watchOS simulator on this runner"
            xcrun simctl list runtimes
            exit 1
          fi
          xcrun simctl list devices available | grep -F "$udid"
          xcrun simctl boot "$udid" || true      # already-booted is not an error
          xcrun simctl bootstatus "$udid" -b
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      - name: Test
        timeout-minutes: 20
        env:
          NSUnbufferedIO: YES
        run: |
          set -o pipefail
          xcodebuild test \
            -project Quant.xcodeproj \
            -scheme "QuantWatch Watch App" \
            -destination "platform=watchOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -only-testing:"QuantWatch Watch AppTests" \
            -resultBundlePath WatchTestResults.xcresult

      - name: Summarise results
        if: always()
        # Counts from the result bundle, as in the iOS job.
        run: |
          [ -d WatchTestResults.xcresult ] || exit 0
          xcrun xcresulttool get test-results summary \
            --path WatchTestResults.xcresult > summary.json
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("summary.json"))
          print(f'**Watch: {d.get("result")}** - {d.get("passedTests")} passed, '
                f'{d.get("failedTests")} failed, {d.get("skippedTests")} skipped, '
                f'of {d.get("totalTestCount")} tests')
          PY
          cat "$GITHUB_STEP_SUMMARY"

      - name: Upload result bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WatchTestResults.xcresult
          path: WatchTestResults.xcresult
          retention-days: 7
