# The TypeSafe key is NEVER in this file. It is set once, out of band:
#
#     wrangler secret put TYPESAFE_KEY
#
# and reaches the Worker as env.TYPESAFE_KEY at runtime. `.dev.vars` holds it for
# local `wrangler dev` and is gitignored.
name = "jev-proxy"
main = "src/index.ts"
compatibility_date = "2026-09-01"

# Both of these were defaulted-on at the first deploy and warned about. They are set
# explicitly because for an UNAUTHENTICATED endpoint the number of public URLs IS the
# attack surface.
#
# NOTE ON PLACEMENT: these must stay above [observability]. In TOML, keys written after a
# table header belong to that table — put them below and they become
# observability.workers_dev / observability.preview_urls, which wrangler ignores in silence,
# leaving Preview URLs enabled. That mistake was made and caught here by parsing the file
# rather than trusting the edit.

# One stable URL for the app to talk to.
workers_dev = true

# OFF. Left enabled, Cloudflare publishes an extra public URL for every deployed version —
# each a fully working proxy that spends Jev credits, none of which the app needs. One
# endpoint to rate-limit and reason about beats per-version convenience.
preview_urls = false

# Observability without logging payloads: posture features are personal data, so the Worker
# logs status codes and request ids, never request or response bodies.
[observability]
enabled = true

# Workers Rate Limiting binding — the abuse brake on an unauthenticated endpoint whose URL now
# ships in every TestFlight binary.
#
# A WAF / Rate Limiting Rule cannot do this job: those are zone-scoped, and a workers.dev
# subdomain sits outside any zone you control. Moving to a custom domain would make the WAF an
# option; until then this binding is it.
#
# `period` accepts only 10 or 60, so 30/min is limit = 30 with period = 60.
# Keep RATE_WINDOW_SECONDS in src/index.ts equal to period — it is sent as Retry-After.
[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 30
  period = 60
